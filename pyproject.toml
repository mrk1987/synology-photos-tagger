[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synology-photos-tagger"
version = "0.1.0"
description = "Group faces into people and tag images for Synology Photos on your own GPU"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "insightface>=0.7.3",
    "onnxruntime-gpu[cuda,cudnn]>=1.20",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "numpy>=1.26",
    "scipy>=1.11",
    "opencv-python-headless>=4.9",
    "pillow>=10",
    "pillow-heif>=0.16",
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
]

[project.scripts]
spt = "synology_photos_tagger.cli:main"

[tool.setuptools.package-data]
synology_photos_tagger = ["stop_tags.txt"]
